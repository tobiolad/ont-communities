services:
  db:
    image: postgres:16-alpine
    container_name: ont_infrastructure_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ont_infrastructure}
      POSTGRES_USER: ${POSTGRES_USER:-ont_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ont_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ont_db_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ont_app} -d ${POSTGRES_DB:-ont_infrastructure}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    container_name: ont_infrastructure_api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ont_app}:${POSTGRES_PASSWORD:-ont_dev_password}@db:5432/${POSTGRES_DB:-ont_infrastructure}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  ont_db_data:
